name: Deploy Integrations Backend

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  test-integrations-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Integrations-backend/package-lock.json

      - name: Install integrations backend dependencies
        run: cd Integrations-backend && npm ci

      - name: Run OAuth and Connected Inbound release regressions
        run: |
          cd Integrations-backend
          npx jest --runInBand \
            tests/utils/oauthStateStore.auditIntent.test.ts \
            tests/services/inboundInspectorP1Regression.test.ts

  deploy-integrations-backend:
    needs: test-integrations-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy integrations backend
        run: |
          cd Integrations-backend
          fly deploy -a opside-integrations-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify integrations backend health
        run: |
          sleep 60
          curl --fail --retry 5 --retry-delay 5 https://opside-integrations-backend.fly.dev/health

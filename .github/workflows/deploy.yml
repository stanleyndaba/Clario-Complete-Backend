name: Validate and Verify Render Backend

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

jobs:
  test-integrations-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Integrations-backend/package-lock.json

      - name: Install integrations backend dependencies
        run: cd Integrations-backend && npm ci

      - name: Run OAuth and Connected Inbound release regressions
        run: |
          cd Integrations-backend
          npx jest --runInBand \
            tests/utils/oauthStateStore.auditIntent.test.ts \
            tests/services/inboundInspectorP1Regression.test.ts

  verify-render-backend:
    needs: test-integrations-release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - name: Verify Render backend health
        run: |
          curl --fail --retry 12 --retry-delay 10 \
            --retry-connrefused \
            https://opside-node-api-woco.onrender.com/health
